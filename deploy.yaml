name: Deploy Aboba App

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Log in Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/aboba-web:latest

      - name: Deploy to server 
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SERVER_HOST}}
          username: root
          key: ${{secrets.SERVER_SSH_KEY}}
          script: |
            docker pull ${{secrets.DOCKER_USERNAME}}/aboba-web:latest
            docker rm -f web-container || true
            docker run -d -p 80:8000 --name web-container ${{secrets.DOCKER_USERNAME}}/aboba-web:latest